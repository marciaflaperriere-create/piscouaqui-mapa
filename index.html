<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piscou Aqui — Mapa de Calor Hexagonal (H3)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="libs-final/leaflet.css">
<script src="libs-final/leaflet.js"></script>
<script src="libs-final/h3-js.umd.js"></script>

<style>
:root{
  --amarelo:#FFD400;
  --preto:#0D0D0D;
  --carvao:#181818;
  --grafite:#242424;
  --papel:#F5F1E4;
  --cinza:#9A958A;
  --display:'Archivo Black',sans-serif;
  --corpo:'Archivo',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--preto);font-family:var(--corpo);color:var(--papel);height:100vh;overflow:hidden}

.lacre{height:10px;width:100%;background:repeating-linear-gradient(-45deg,var(--amarelo) 0 20px,var(--preto) 20px 40px);position:relative;z-index:1000}

.topo{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;background:var(--carvao);border-bottom:2px solid var(--grafite);
  position:relative;z-index:1000;
}
.logo{font-family:var(--display);font-size:1.1rem;color:var(--papel);display:flex;align-items:center;gap:.5rem;text-transform:uppercase}
.logo .raio{color:var(--amarelo)}
.controles{display:flex;align-items:center;gap:14px}
.controles label{font-family:var(--mono);font-size:.72rem;color:var(--cinza);text-transform:uppercase;letter-spacing:.05em}
.controles select{
  background:var(--preto);color:var(--papel);border:1.5px solid var(--grafite);
  font-family:var(--mono);font-size:.8rem;padding:6px 10px;
}
.controles select:focus{outline:2px solid var(--amarelo)}

#mapa{height:calc(100vh - 106px);width:100%}

.legenda{
  position:absolute;bottom:24px;left:24px;z-index:900;
  background:var(--carvao);border:2px solid var(--amarelo);
  padding:14px 18px;font-family:var(--mono);font-size:.72rem;
  box-shadow:6px 6px 0 rgba(0,0,0,.5);
}
.legenda-titulo{color:var(--amarelo);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-size:.68rem}
.legenda-escala{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.legenda-cor{width:16px;height:16px;flex-shrink:0}
.legenda-nota{color:var(--cinza);margin-top:8px;max-width:220px;line-height:1.4}

.placar{
  position:absolute;top:130px;right:24px;z-index:900;
  background:var(--preto);border:2px solid var(--amarelo);
  width:260px;box-shadow:8px 8px 0 rgba(0,0,0,.55);
}
.placar-head{background:var(--amarelo);color:var(--preto);font-family:var(--mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;padding:8px 14px}
.placar-body{padding:14px}
.placar-linha{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grafite)}
.placar-linha:last-child{border-bottom:none}
.placar-label{font-family:var(--mono);font-size:.68rem;color:var(--cinza);text-transform:uppercase}
.placar-valor{font-family:var(--display);font-size:1.3rem;color:var(--amarelo)}

.hex-tooltip{font-family:var(--mono);font-size:.75rem}
.hex-tooltip strong{color:var(--amarelo)}

@media (max-width:640px){
  .placar{display:none}
  .legenda{bottom:16px;left:16px;font-size:.65rem;padding:10px 12px}
}
</style>
</head>
<body>

<div class="lacre"></div>
<header class="topo">
  <div class="logo"><span class="raio">&#9889;</span> Piscou Aqui — Mapa H3</div>
  <div class="controles">
    <label for="resolucao">Granularidade</label>
    <select id="resolucao">
      <option value="8">Bairro (H3 res. 8, ~0,7 km²)</option>
      <option value="9" selected>Quarteirão (H3 res. 9, ~0,1 km²)</option>
      <option value="10">Rua (H3 res. 10, ~0,015 km²)</option>
    </select>
  </div>
</header>

<div id="mapa"></div>

<aside class="legenda">
  <div class="legenda-titulo">Registros por hexágono</div>
  <div id="legenda-escala"></div>
  <div class="legenda-nota">Cada célula agrega todos os registros dentro daquela área — a localização exata de ninguém aparece no mapa público.</div>
</aside>

<aside class="placar">
  <div class="placar-head">Resumo da janela ativa</div>
  <div class="placar-body">
    <div class="placar-linha"><span class="placar-label">Total de registros</span><span class="placar-valor" id="stat-total">—</span></div>
    <div class="placar-linha"><span class="placar-label">Hexágonos ativos</span><span class="placar-valor" id="stat-hexagonos">—</span></div>
    <div class="placar-linha"><span class="placar-label">Pico (maior célula)</span><span class="placar-valor" id="stat-pico">—</span></div>
  </div>
</aside>

<script>
/* =====================================================================
   CONFIG — troque estes dados por uma leitura real do Airtable quando
   o pipeline de geocodificação estiver pronto (ver nota no final).
===================================================================== */
const CENTRO = [-20.2932, -40.2963]; // Praia do Canto, Vitória/ES
const ZOOM_INICIAL = 15;

/* ---- Busca os dados reais publicados pelo Apps Script ---- */

let TODOS_OS_PONTOS = []; // populado pelo fetch() dos dados reais, abaixo

/* =====================================================================
   MAPA BASE (Leaflet + tiles escuros)
===================================================================== */
const mapa = L.map("mapa", { zoomControl: true, scrollWheelZoom: true })
  .setView(CENTRO, ZOOM_INICIAL);

L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: "abcd",
  maxZoom: 19
}).addTo(mapa);

let camadaHexagonos = L.layerGroup().addTo(mapa);

/* =====================================================================
   H3: agrega os pontos em células hexagonais e desenha
===================================================================== */
function corPorIntensidade(contagem, maxContagem) {
  const t = Math.min(contagem / maxContagem, 1);
  // gradiente: marrom escuro -> amarelo da marca -> quase branco no pico
  if (t < 0.5) {
    const p = t / 0.5;
    return interpolar("#3a2f00", "#FFD400", p);
  } else {
    const p = (t - 0.5) / 0.5;
    return interpolar("#FFD400", "#FFF6CC", p);
  }
}
function interpolar(corA, corB, p) {
  const a = hexParaRgb(corA), b = hexParaRgb(corB);
  const r = Math.round(a[0] + (b[0]-a[0])*p);
  const g = Math.round(a[1] + (b[1]-a[1])*p);
  const bl = Math.round(a[2] + (b[2]-a[2])*p);
  return `rgb(${r},${g},${bl})`;
}
function hexParaRgb(hex){
  hex = hex.replace('#','');
  return [parseInt(hex.substring(0,2),16), parseInt(hex.substring(2,4),16), parseInt(hex.substring(4,6),16)];
}

function renderizarHexagonos(resolucao) {
  camadaHexagonos.clearLayers();

  if (TODOS_OS_PONTOS.length === 0) {
    document.getElementById("stat-total").textContent = "0";
    document.getElementById("stat-hexagonos").textContent = "0";
    document.getElementById("stat-pico").textContent = "—";
    document.getElementById("legenda-escala").innerHTML =
      '<div style="color:#9A958A">Nenhum registro ainda. O mapa se preenche conforme os moradores registram.</div>';
    return;
  }

  // 1. agrega cada ponto na célula H3 correspondente
  const contagemPorCelula = {};
  TODOS_OS_PONTOS.forEach(([lat, lng]) => {
    const celula = h3.latLngToCell(lat, lng, resolucao);
    contagemPorCelula[celula] = (contagemPorCelula[celula] || 0) + 1;
  });

  const celulas = Object.keys(contagemPorCelula);
  const maxContagem = Math.max(...celulas.map(c => contagemPorCelula[c]));

  // 2. desenha cada célula como polígono no Leaflet
  celulas.forEach(celula => {
    const contagem = contagemPorCelula[celula];
    const limites = h3.cellToBoundary(celula); // array de [lat,lng]
    const cor = corPorIntensidade(contagem, maxContagem);

    const poligono = L.polygon(limites, {
      color: "#0D0D0D",
      weight: 1,
      fillColor: cor,
      fillOpacity: 0.75
    }).addTo(camadaHexagonos);

    poligono.bindTooltip(
      `<div class="hex-tooltip"><strong>${contagem}</strong> registro${contagem > 1 ? 's' : ''}<br>célula ${celula.slice(0,8)}…</div>`,
      { sticky: true }
    );
  });

  // 3. atualiza o placar
  document.getElementById("stat-total").textContent = TODOS_OS_PONTOS.length;
  document.getElementById("stat-hexagonos").textContent = celulas.length;
  document.getElementById("stat-pico").textContent = maxContagem;

  // 4. atualiza a legenda de cores
  const legendaEl = document.getElementById("legenda-escala");
  legendaEl.innerHTML = "";
  [0.15, 0.4, 0.7, 1].forEach(t => {
    const cor = corPorIntensidade(t * maxContagem, maxContagem);
    const linha = document.createElement("div");
    linha.className = "legenda-escala";
    linha.innerHTML = `<span class="legenda-cor" style="background:${cor}"></span> ${Math.round(t*maxContagem)} registro${Math.round(t*maxContagem)===1?'':'s'}`;
    legendaEl.appendChild(linha);
  });
}

/* =====================================================================
   Busca o arquivo de dados reais (publicado pelo Apps Script no mesmo
   repositório) e só então renderiza o mapa. Se o arquivo ainda não
   existir (primeiro deploy, antes do primeiro registro real), trata
   como "mapa vazio" em vez de quebrar.
===================================================================== */
async function carregarDadosReais() {
  try {
    const resp = await fetch("dados/registros.json?t=" + Date.now()); // evita cache
    if (!resp.ok) throw new Error("Arquivo de dados ainda não publicado");
    const dados = await resp.json();
    TODOS_OS_PONTOS = (dados.pontos || []).map(p => [p.lat, p.lng]);
    if (dados.atualizado_em) {
      const el = document.querySelector(".legenda-nota");
      if (el) {
        const dataFmt = new Date(dados.atualizado_em).toLocaleString("pt-BR");
        el.insertAdjacentHTML("afterend",
          `<div style="font-family:var(--mono);font-size:.62rem;color:#5a564d;margin-top:6px;">Atualizado em ${dataFmt}</div>`);
      }
    }
  } catch (erro) {
    console.warn("Sem dados publicados ainda:", erro.message);
    TODOS_OS_PONTOS = [];
  }
  renderizarHexagonos(parseInt(document.getElementById("resolucao").value, 10));
}

carregarDadosReais();
document.getElementById("resolucao").addEventListener("change", (e) => {
  renderizarHexagonos(parseInt(e.target.value, 10));
});
</script>
</body>
</html>
