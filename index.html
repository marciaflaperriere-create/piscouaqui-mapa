<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piscou Aqui — Mapa de Calor Hexagonal (H3)</title>

<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="libs-final/leaflet.css">
<script src="libs-final/leaflet.js"></script>
<script src="libs-final/h3-js.umd.js"></script>

<style>
:root{
  --amarelo:#FFD400;
  --preto:#0D0D0D;
  --carvao:#181818;
  --grafite:#242424;
  --papel:#F5F1E4;
  --cinza:#9A958A;
  --display:'Archivo Black',sans-serif;
  --corpo:'Archivo',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--preto);font-family:var(--corpo);color:var(--papel);height:100vh;overflow:hidden}

.lacre{height:10px;width:100%;background:repeating-linear-gradient(-45deg,var(--amarelo) 0 20px,var(--preto) 20px 40px);position:relative;z-index:1000}

.topo{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;background:var(--carvao);border-bottom:2px solid var(--grafite);
  position:relative;z-index:1000;
  flex-wrap:wrap;gap:12px;
}
.logo{font-family:var(--display);font-size:1.1rem;color:var(--papel);display:flex;align-items:center;gap:.5rem;text-transform:uppercase}
.logo .raio{color:var(--amarelo)}
.controles{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.controles label{font-family:var(--mono);font-size:.72rem;color:var(--cinza);text-transform:uppercase;letter-spacing:.05em}
.controles select,.controles input[type="date"]{
  background:var(--preto);color:var(--papel);border:1.5px solid var(--grafite);
  font-family:var(--mono);font-size:.8rem;padding:6px 10px;
}
.controles select:focus,.controles input[type="date"]:focus{outline:2px solid var(--amarelo)}
.controles button{
  background:var(--amarelo);color:var(--preto);border:none;
  font-family:var(--mono);font-size:.75rem;font-weight:600;text-transform:uppercase;
  padding:7px 12px;cursor:pointer;letter-spacing:.04em;
}
.controles button:hover{background:#fff}

#periodo-custom{display:none;align-items:center;gap:8px;flex-wrap:wrap}
#periodo-custom span{font-family:var(--mono);font-size:.72rem;color:var(--cinza)}

#mapa{height:calc(100vh - 106px);width:100%}

.legenda{
  position:absolute;bottom:24px;left:24px;z-index:900;
  background:var(--carvao);border:2px solid var(--amarelo);
  padding:14px 18px;font-family:var(--mono);font-size:.72rem;
  box-shadow:6px 6px 0 rgba(0,0,0,.5);
}
.legenda-titulo{color:var(--amarelo);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-size:.68rem}
.legenda-escala{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.legenda-cor{width:16px;height:16px;flex-shrink:0}
.legenda-nota{color:var(--cinza);margin-top:8px;max-width:220px;line-height:1.4}

.placar{
  position:absolute;top:130px;right:24px;z-index:900;
  background:var(--preto);border:2px solid var(--amarelo);
  width:260px;box-shadow:8px 8px 0 rgba(0,0,0,.55);
}
.placar-head{background:var(--amarelo);color:var(--preto);font-family:var(--mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;padding:8px 14px}
.placar-body{padding:14px}
.placar-linha{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grafite)}
.placar-linha:last-child{border-bottom:none}
.placar-label{font-family:var(--mono);font-size:.68rem;color:var(--cinza);text-transform:uppercase}
.placar-valor{font-family:var(--display);font-size:1.3rem;color:var(--amarelo)}

.hex-tooltip{font-family:var(--mono);font-size:.75rem}
.hex-tooltip strong{color:var(--amarelo)}

@media (max-width:640px){
  .placar{display:none}
  .legenda{bottom:16px;left:16px;font-size:.65rem;padding:10px 12px}
  .topo{padding:12px 16px}
}
</style>
</head>
<body>

<div class="lacre"></div>
<header class="topo">
  <div class="logo"><span class="raio">⚡</span> Piscou Aqui — Mapa H3</div>
  <div class="controles">
    <label for="periodo">Período</label>
    <select id="periodo">
      <option value="todos" selected>Todo o histórico</option>
      <option value="24h">Últimas 24 horas</option>
      <option value="7d">Últimos 7 dias</option>
      <option value="30d">Últimos 30 dias</option>
      <option value="custom">Personalizado…</option>
    </select>
    <span id="periodo-custom">
      <input type="date" id="data-inicio">
      <span>até</span>
      <input type="date" id="data-fim">
      <button id="aplicar-periodo">Aplicar</button>
    </span>

    <label for="resolucao">Granularidade</label>
    <select id="resolucao">
      <option value="8">Bairro (H3 res. 8, ~0,7 km²)</option>
      <option value="9" selected>Quarteirão (H3 res. 9, ~0,1 km²)</option>
      <option value="10">Rua (H3 res. 10, ~0,015 km²)</option>
    </select>
  </div>
</header>

<div id="mapa"></div>

<aside class="legenda">
  <div class="legenda-titulo">Registros por hexágono</div>
  <div id="legenda-escala"></div>
  <div class="legenda-nota">Cada célula agrega todos os registros dentro daquela área — a localização exata de ninguém aparece no mapa público.</div>
</aside>

<aside class="placar">
  <div class="placar-head">Resumo da janela ativa</div>
  <div class="placar-body">
    <div class="placar-linha"><span class="placar-label">Total de registros</span><span class="placar-valor" id="stat-total">—</span></div>
    <div class="placar-linha"><span class="placar-label">Hexágonos ativos</span><span class="placar-valor" id="stat-hexagonos">—</span></div>
    <div class="placar-linha"><span class="placar-label">Pico (maior célula)</span><span class="placar-valor" id="stat-pico">—</span></div>
  </div>
</aside>

<script>
const CENTRO = [-20.2932, -40.2963]; 
const ZOOM_INICIAL = 15;

// Estrutura de dados original corrigida incluindo cronologia para o filtro de Período funcionar
const agora = new Date();
const pontosOriginais = [
  { coord: [-20.2921, -40.2985], data: new Date(agora.getTime() - 2 * 60 * 60 * 1000) }, // 2h atrás
  { coord: [-20.2923, -40.2981], data: new Date(agora.getTime() - 4 * 60 * 60 * 1000) }, // 4h atrás
  { coord: [-20.2919, -40.2989], data: new Date(agora.getTime() - 10 * 60 * 60 * 1000) }, // 10h atrás
  { coord: [-20.2925, -40.2983], data: new Date(agora.getTime() - 22 * 60 * 60 * 1000) }, // 22h atrás
  { coord: [-20.2920, -40.2987], data: new Date(agora.getTime() - 1 * 24 * 60 * 60 * 1000) }, // 1 dia atrás
  { coord: [-20.2922, -40.2984], data: new Date(agora.getTime() - 3 * 24 * 60 * 60 * 1000) }, // 3 dias atrás
  { coord: [-20.2924, -40.2966], data: new Date(agora.getTime() - 5 * 24 * 60 * 60 * 1000) }, // 5 dias atrás
  { coord: [-20.2918, -40.2982], data: new Date(agora.getTime() - 6 * 24 * 60 * 60 * 1000) }, // 6 dias atrás
  { coord: [-20.2955, -40.2930], data: new Date(agora.getTime() - 12 * 24 * 60 * 60 * 1000) }, // 12 dias atrás
  { coord: [-20.2953, -40.2933], data: new Date(agora.getTime() - 15 * 24 * 60 * 60 * 1000) }, // 15 dias atrás
  { coord: [-20.2957, -40.2928], data: new Date(agora.getTime() - 18 * 24 * 60 * 60 * 1000) }, // 18 dias atrás
  { coord: [-20.2954, -40.2931], data: new Date(agora.getTime() - 20 * 24 * 60 * 60 * 1000) }, // 20 dias atrás
  { coord: [-20.2932, -40.2963], data: new Date(agora.getTime() - 22 * 24 * 60 * 60 * 1000) }, // 22 dias atrás
  { coord: [-20.2940, -40.2970], data: new Date(agora.getTime() - 25 * 24 * 60 * 60 * 1000) }, // 25 dias atrás
  { coord: [-20.2910, -40.2950], data: new Date(agora.getTime() - 28 * 24 * 60 * 60 * 1000) }, // 28 dias atrás
  { coord: [-20.2960, -40.2990], data: new Date(agora.getTime() - 40 * 24 * 60 * 60 * 1000) }  // 40 dias atrás
];

const mapa = L.map("mapa", { zoomControl: true, scrollWheelZoom: true })
  .setView(CENTRO, ZOOM_INICIAL);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(mapa);

let camadaHexagonos = L.layerGroup().addTo(mapa);

// Correção matemática definitiva na interpolação das cores
function corPorIntensidade(contagem, maxContagem) {
  const t = maxContagem > 1 ? Math.min((contagem - 1) / (maxContagem - 1), 1) : 0;
  
  // Gradiente limpo e real da sua marca: Marrom escuro (#3A2F00) -> Amarelo Piscou (#FFD400)
  const r = Math.round(58 + (255 - 58) * t);
  const g = Math.round(47 + (212 - 47) * t);
  const b = Math.round(0 + (0 - 0) * t);
  
  return `rgb(${r}, ${g}, ${b})`;
}

function filtrarPontos() {
  const periodo = document.getElementById("periodo").value;
  const dataLimite = new Date();

  if (periodo === "todos") return pontosOriginais;
  if (periodo === "24h") dataLimite.setHours(dataLimite.getHours() - 24);
  else if (periodo === "7d") dataLimite.setDate(dataLimite.getDate() - 7);
  else if (periodo === "30d") dataLimite.setDate(dataLimite.getDate() - 30);
  else if (periodo === "custom") {
    const inicio = new Date(document.getElementById("data-inicio").value);
    const fim = new Date(document.getElementById("data-fim").value);
    if (isNaN(inicio) || isNaN(fim)) return pontosOriginais;
    fim.setHours(23, 59, 59);
    return pontosOriginais.filter(p => p.data >= inicio && p.data <= fim);
  }
  return pontosOriginais.filter(p => p.data >= dataLimite);
}

function renderizarHexagonos() {
  camadaHexagonos.clearLayers();
  
  const resolucao = parseInt(document.getElementById("resolucao").value);
  const pontosFiltrados = filtrarPontos();

  const contagemPorCelula = {};
  pontosFiltrados.forEach(p => {
    const celula = h3.latLngToCell(p.coord[0], p.coord[1], resolucao);
    contagemPorCelula[celula] = (contagemPorCelula[celula] || 0) + 1;
  });

  const celulas = Object.keys(contagemPorCelula);
  
  if (celulas.length === 0) {
