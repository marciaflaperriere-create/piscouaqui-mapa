<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piscou Aqui — Mapa de Calor Hexagonal (H3)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="libs-final/leaflet.css">
<script src="libs-final/leaflet.js"></script>
<script src="libs-final/h3-js.umd.js"></script>

<style>
:root{
  --amarelo:#FFD400;
  --preto:#0D0D0D;
  --carvao:#181818;
  --grafite:#242424;
  --papel:#F5F1E4;
  --cinza:#9A958A;
  --display:'Archivo Black',sans-serif;
  --corpo:'Archivo',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--preto);font-family:var(--corpo);color:var(--papel);height:100vh;overflow:hidden}

.lacre{height:10px;width:100%;background:repeating-linear-gradient(-45deg,var(--amarelo) 0 20px,var(--preto) 20px 40px);position:relative;z-index:1000}

.topo{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;background:var(--carvao);border-bottom:2px solid var(--grafite);
  position:relative;z-index:1000;
  flex-wrap:wrap;gap:12px;
}
.logo{font-family:var(--display);font-size:1.1rem;color:var(--papel);display:flex;align-items:center;gap:.5rem;text-transform:uppercase}
.logo .raio{color:var(--amarelo)}
.controles{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.controles label{font-family:var(--mono);font-size:.72rem;color:var(--cinza);text-transform:uppercase;letter-spacing:.05em}
.controles select,.controles input[type="date"]{
  background:var(--preto);color:var(--papel);border:1.5px solid var(--grafite);
  font-family:var(--mono);font-size:.8rem;padding:6px 10px;
}
.controles select:focus,.controles input[type="date"]:focus{outline:2px solid var(--amarelo)}
.controles button{
  background:var(--amarelo);color:var(--preto);border:none;
  font-family:var(--mono);font-size:.75rem;font-weight:600;text-transform:uppercase;
  padding:7px 12px;cursor:pointer;letter-spacing:.04em;
}
.controles button:hover{background:#fff}

#periodo-custom{display:none;align-items:center;gap:8px;flex-wrap:wrap}
#periodo-custom span{font-family:var(--mono);font-size:.72rem;color:var(--cinza)}

#mapa{height:calc(100vh - 106px);width:100%}

.legenda{
  position:absolute;bottom:24px;left:24px;z-index:900;
  background:var(--carvao);border:2px solid var(--amarelo);
  padding:14px 18px;font-family:var(--mono);font-size:.72rem;
  box-shadow:6px 6px 0 rgba(0,0,0,.5);
}
.legenda-titulo{color:var(--amarelo);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-size:.68rem}
.legenda-escala{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.legenda-cor{width:16px;height:16px;flex-shrink:0}
.legenda-nota{color:var(--cinza);margin-top:8px;max-width:220px;line-height:1.4}

.placar{
  position:absolute;top:130px;right:24px;z-index:900;
  background:var(--preto);border:2px solid var(--amarelo);
  width:260px;box-shadow:8px 8px 0 rgba(0,0,0,.55);
}
.placar-head{background:var(--amarelo);color:var(--preto);font-family:var(--mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;padding:8px 14px}
.placar-body{padding:14px}
.placar-linha{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grafite)}
.placar-linha:last-child{border-bottom:none}
.placar-label{font-family:var(--mono);font-size:.68rem;color:var(--cinza);text-transform:uppercase}
.placar-valor{font-family:var(--display);font-size:1.3rem;color:var(--amarelo)}
.placar-rodape{font-family:var(--mono);font-size:.62rem;color:var(--cinza);padding:0 14px 12px;line-height:1.4}

.aviso{
  position:absolute;top:130px;left:50%;transform:translateX(-50%);z-index:950;
  background:var(--carvao);border:2px solid var(--amarelo);color:var(--papel);
  font-family:var(--mono);font-size:.78rem;line-height:1.5;text-align:center;
  padding:12px 18px;max-width:min(420px,calc(100% - 32px));
  box-shadow:6px 6px 0 rgba(0,0,0,.5);display:none;
}
.aviso strong{color:var(--amarelo)}
.aviso.erro{border-color:#FF5A3C}
.aviso.erro strong{color:#FF5A3C}

.hex-tooltip{font-family:var(--mono);font-size:.75rem}
.hex-tooltip strong{color:var(--amarelo)}

@media (max-width:640px){
  .placar{display:none}
  .legenda{bottom:16px;left:16px;font-size:.65rem;padding:10px 12px}
  .topo{padding:12px 16px}
  .aviso{top:auto;bottom:140px}
}
</style>
</head>
<body>

<div class="lacre"></div>
<header class="topo">
  <div class="logo"><span class="raio">⚡</span> Piscou Aqui — Mapa H3</div>
  <div class="controles">
    <label for="periodo">Período</label>
    <select id="periodo">
      <option value="todos" selected>Todo o histórico</option>
      <option value="24h">Últimas 24 horas</option>
      <option value="7d">Últimos 7 dias</option>
      <option value="30d">Últimos 30 dias</option>
      <option value="custom">Personalizado…</option>
    </select>
    <span id="periodo-custom">
      <input type="date" id="data-inicio">
      <span>até</span>
      <input type="date" id="data-fim">
      <button id="aplicar-periodo">Aplicar</button>
    </span>

    <label for="tipo">Tipo</label>
    <select id="tipo">
      <option value="todos" selected>Todos</option>
      <option value="apagao">Apagão</option>
      <option value="oscilacao">Oscilação</option>
    </select>

    <label for="resolucao">Granularidade</label>
    <select id="resolucao">
      <option value="8">Bairro (H3 res. 8, ~0,7 km²)</option>
      <option value="9" selected>Quarteirão (H3 res. 9, ~0,1 km²)</option>
      <option value="10">Rua (H3 res. 10, ~0,015 km²)</option>
    </select>
  </div>
</header>

<div id="mapa"></div>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<aside class="legenda">
  <div class="legenda-titulo">Registros por hexágono</div>
  <div id="legenda-escala"></div>
  <div class="legenda-nota">Cada célula agrega todos os registros dentro daquela área — a localização exata de ninguém aparece no mapa público.</div>
</aside>

<aside class="placar">
  <div class="placar-head">Resumo da janela ativa</div>
  <div class="placar-body">
    <div class="placar-linha"><span class="placar-label">Total de registros</span><span class="placar-valor" id="stat-total">—</span></div>
    <div class="placar-linha"><span class="placar-label">Hexágonos ativos</span><span class="placar-valor" id="stat-hexagonos">—</span></div>
    <div class="placar-linha"><span class="placar-label">Pico (maior célula)</span><span class="placar-valor" id="stat-pico">—</span></div>
  </div>
  <div class="placar-rodape" id="stat-atualizado">Carregando dados…</div>
</aside>

<script>
const URL_DADOS = "dados/registros.json";
// Usado só enquanto os dados carregam ou se não houver pontos válidos
const CENTRO_PADRAO = [-20.2932, -40.2963];
const ZOOM_PADRAO = 13;

const ROTULO_TIPO = { apagao: "apagão", oscilacao: "oscilação" };

let pontosOriginais = [];
let atualizadoEm = null;
let dadosCarregados = false;

const mapa = L.map("mapa", { zoomControl: true, scrollWheelZoom: true })
  .setView(CENTRO_PADRAO, ZOOM_PADRAO);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(mapa);

let camadaHexagonos = L.layerGroup().addTo(mapa);

function corPorIntensidade(contagem, maxContagem) {
  const t = maxContagem > 1 ? Math.min((contagem - 1) / (maxContagem - 1), 1) : 0;

  // Gradiente real da marca: Marrom escuro para Amarelo Piscou
  const r = Math.round(58 + (255 - 58) * t);
  const g = Math.round(47 + (212 - 47) * t);
  const b = Math.round(0 * t);

  return `rgb(${r}, ${g}, ${b})`;
}

function formatarData(d) {
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function formatarDataHora(d) {
  return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

// "AAAA-MM-DD" do <input type="date"> como data LOCAL (new Date("AAAA-MM-DD") seria UTC)
function dataLocal(valor) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(valor || "");
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}

function mostrarAviso(html, erro = false) {
  const aviso = document.getElementById("aviso");
  aviso.innerHTML = html;
  aviso.classList.toggle("erro", erro);
  aviso.style.display = "block";
}

function esconderAviso() {
  document.getElementById("aviso").style.display = "none";
}

function filtrarPorPeriodo(pontos) {
  const periodo = document.getElementById("periodo").value;
  const dataLimite = new Date();

  if (periodo === "todos") return pontos;
  if (periodo === "24h") dataLimite.setHours(dataLimite.getHours() - 24);
  else if (periodo === "7d") dataLimite.setDate(dataLimite.getDate() - 7);
  else if (periodo === "30d") dataLimite.setDate(dataLimite.getDate() - 30);
  else if (periodo === "custom") {
    const inicio = dataLocal(document.getElementById("data-inicio").value);
    const fim = dataLocal(document.getElementById("data-fim").value);
    if (fim) fim.setHours(23, 59, 59, 999);
    return pontos.filter(p => (!inicio || p.data >= inicio) && (!fim || p.data <= fim));
  }
  return pontos.filter(p => p.data >= dataLimite);
}

function filtrarPorTipo(pontos) {
  const tipo = document.getElementById("tipo").value;
  if (tipo === "todos") return pontos;
  return pontos.filter(p => p.tipo === tipo);
}

function filtrarPontos() {
  return filtrarPorTipo(filtrarPorPeriodo(pontosOriginais));
}

function textoTooltip(celula) {
  const partes = [];
  if (celula.apagao) partes.push(`${celula.apagao} ${celula.apagao === 1 ? "apagão" : "apagões"}`);
  if (celula.oscilacao) partes.push(`${celula.oscilacao} ${celula.oscilacao === 1 ? "oscilação" : "oscilações"}`);
  const detalhe = partes.length ? `<br>${partes.join(" · ")}` : "";
  return `<div class="hex-tooltip"><strong>${celula.total} ${celula.total === 1 ? "registro" : "registros"}</strong> nesta área${detalhe}</div>`;
}

function avisoJanelaVazia() {
  if (pontosOriginais.length === 0) {
    return "<strong>Nenhum registro publicado ainda.</strong>";
  }
  const ultimo = pontosOriginais.reduce((a, b) => (b.data > a.data ? b : a)).data;
  return `<strong>Nenhum registro nesta janela.</strong><br>O registro mais recente é de ${formatarData(ultimo)}. Tente um período maior ou "Todo o histórico".`;
}

function renderizarHexagonos() {
  camadaHexagonos.clearLayers();
  if (!dadosCarregados) return;

  const resolucao = parseInt(document.getElementById("resolucao").value, 10);
  const pontosFiltrados = filtrarPontos();

  const contagemPorCelula = {};
  pontosFiltrados.forEach(p => {
    const id = h3.latLngToCell(p.coord[0], p.coord[1], resolucao);
    const celula = contagemPorCelula[id] || (contagemPorCelula[id] = { total: 0, apagao: 0, oscilacao: 0 });
    celula.total += 1;
    if (p.tipo === "apagao" || p.tipo === "oscilacao") celula[p.tipo] += 1;
  });

  const celulas = Object.keys(contagemPorCelula);

  if (celulas.length === 0) {
    document.getElementById("stat-total").innerText = 0;
    document.getElementById("stat-hexagonos").innerText = 0;
    document.getElementById("stat-pico").innerText = 0;
    document.getElementById("legenda-escala").innerHTML = "Sem registros nesta janela.";
    mostrarAviso(avisoJanelaVazia());
    return;
  }

  esconderAviso();

  const maxContagem = Math.max(...celulas.map(c => contagemPorCelula[c].total));

  celulas.forEach(id => {
    const celula = contagemPorCelula[id];
    const limites = h3.cellToBoundary(id);
    const cor = corPorIntensidade(celula.total, maxContagem);
    const pol = L.polygon(limites, {
      color: "#0D0D0D",
      weight: 1.5,
      fillColor: cor,
      fillOpacity: 0.75
    });
    pol.bindTooltip(textoTooltip(celula));
    camadaHexagonos.addLayer(pol);
  });

  document.getElementById("stat-total").innerText = pontosFiltrados.length;
  document.getElementById("stat-hexagonos").innerText = celulas.length;
  document.getElementById("stat-pico").innerText = maxContagem;

  const legendaEscala = document.getElementById("legenda-escala");
  legendaEscala.innerHTML = "";
  const valoresLegenda = maxContagem === 1 ? [1] : [...new Set([1, Math.round(maxContagem / 2), maxContagem])];
  valoresLegenda.forEach(val => {
    const cor = corPorIntensidade(val, maxContagem);
    legendaEscala.innerHTML += `<div class="legenda-escala"><div class="legenda-cor" style="background:${cor}"></div> <span>${val} ${val === 1 ? "registro" : "registros"}</span></div>`;
  });
}

function enquadrarPontos() {
  if (pontosOriginais.length === 0) return;
  const limites = L.latLngBounds(pontosOriginais.map(p => p.coord));
  mapa.fitBounds(limites, { padding: [40, 40], maxZoom: 16 });
}

async function carregarDados() {
  try {
    const resposta = await fetch(URL_DADOS, { cache: "no-store" });
    if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);
    const json = await resposta.json();
    if (!json || !Array.isArray(json.pontos)) throw new Error("formato inesperado (falta a lista \"pontos\")");

    pontosOriginais = json.pontos
      .map(p => ({
        coord: [Number(p.lat), Number(p.lng)],
        tipo: p.tipo,
        data: new Date(p.data)
      }))
      .filter(p => Number.isFinite(p.coord[0]) && Number.isFinite(p.coord[1]) && !isNaN(p.data));

    atualizadoEm = json.atualizado_em ? new Date(json.atualizado_em) : null;
    dadosCarregados = true;

    document.getElementById("stat-atualizado").innerText =
      atualizadoEm && !isNaN(atualizadoEm)
        ? `Dados atualizados em ${formatarDataHora(atualizadoEm)}`
        : `${pontosOriginais.length} registros carregados`;

    enquadrarPontos();
    renderizarHexagonos();
  } catch (erro) {
    console.error("Falha ao carregar registros:", erro);
    document.getElementById("stat-atualizado").innerText = "Dados indisponíveis";
    document.getElementById("legenda-escala").innerHTML = "Sem dados.";
    mostrarAviso(`<strong>Não foi possível carregar os registros.</strong><br>Tente recarregar a página em instantes.`, true);
  }
}

document.getElementById("resolucao").addEventListener("change", renderizarHexagonos);
document.getElementById("tipo").addEventListener("change", renderizarHexagonos);

const selectPeriodo = document.getElementById("periodo");
const customCampos = document.getElementById("periodo-custom");
selectPeriodo.addEventListener("change", (e) => {
  if (e.target.value === "custom") {
    customCampos.style.display = "flex";
  } else {
    customCampos.style.display = "none";
    renderizarHexagonos();
  }
});
document.getElementById("aplicar-periodo").addEventListener("click", renderizarHexagonos);

carregarDados();
</script>
</body>
</html>
